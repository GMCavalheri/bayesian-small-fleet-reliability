[project]
name = "smallfleet"
version = "0.1.0"
description = "Bayesian reliability for small fleets: failure-rate estimates and alert thresholds from sparse data, with informative priors from a related large fleet and partial pooling across components, compared against the classical frequentist alert-level method."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Gabriel Milanez Cavalheri" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "pymc>=5.20",
    "arviz>=0.20",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "ipykernel>=6.29",
    "mypy>=1.11",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "scipy-stubs>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smallfleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: MCMC tests (seconds each); run by default, deselect with -m 'not slow'"]

[tool.coverage.run]
source = ["smallfleet"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"

[[tool.mypy.overrides]]
# PyMC, PyTensor and ArviZ ship without type information
module = ["pymc", "pymc.*", "pytensor", "pytensor.*", "arviz", "arviz.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
# notebooks are generated by notebooks/build_notebooks.py; lint that file instead
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]
ignore = [
    "E741",  # single-letter math names (l, I) are idiomatic here
]

[tool.ruff.lint.per-file-ignores]
"notebooks/build_notebooks.py" = ["E501"]  # notebook cell sources are string literals

[tool.ruff.lint.isort]
# validation/ scripts import their sibling helper module directly
known-local-folder = ["common"]
